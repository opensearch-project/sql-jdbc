name: Release drafter

# Push events to every tag not containing "/"
on:
  push:
    tags:
      - "*"

jobs:
  draft-a-release:
    name: Draft a release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
      - name: Set up JDK 11
        uses: actions/setup-java@17f84c3641ba7b8f6deff6309fc4c864478f5d62 # v3
        with:
          java-version: 11
          distribution: 'temurin'
          cache: gradle
      - name: Build with Gradle
        run: |
          ./gradlew publishPublishMavenPublicationToLocalRepoRepository
      - name: Build shadowJar
        run: |
          ./gradlew shadowJar
          mkdir build/shadowJar
          mv build/libs/opensearch-sql-jdbc-shadow-*.jar build/shadowJar
          tar -C build -cvf artifacts.tar.gz repository shadowJar
      - name: Draft a release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd
        with:
          immutableCreate: true
          generateReleaseNotes: true
          artifacts: "artifacts.tar.gz"
          prerelease: true
